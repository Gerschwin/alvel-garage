<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <title>Power sliding door fault-finder</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5D6B7A"/></marker></defs>
  <rect width="400" height="560" fill="#FFFFFF"/>
  <g stroke="#5D6B7A" stroke-width="2" marker-end="url(#a)">
    <line x1="140" y1="56" x2="140" y2="78"/><line x1="140" y1="136" x2="140" y2="158"/><line x1="140" y1="216" x2="140" y2="238"/><line x1="140" y1="296" x2="140" y2="326"/>
    <line x1="258" y1="107" x2="276" y2="107"/><line x1="258" y1="187" x2="276" y2="187"/><line x1="258" y1="267" x2="276" y2="267"/>
    <line x1="140" y1="384" x2="72" y2="410"/><line x1="140" y1="384" x2="200" y2="410"/><line x1="140" y1="384" x2="328" y2="410"/>
  </g>
  <rect x="40" y="12" width="200" height="44" rx="22" fill="#1B2430"/>
  <text x="140" y="40" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Door misbehaving</text>
  <g stroke="#1B2430" stroke-width="1.5" fill="#E8EDF2">
    <rect x="22" y="80" width="236" height="56" rx="8"/><rect x="22" y="160" width="236" height="56" rx="8"/><rect x="22" y="240" width="236" height="56" rx="8"/><rect x="22" y="328" width="236" height="56" rx="8"/>
  </g>
  <g stroke-width="1.5">
    <rect x="278" y="84" width="110" height="46" rx="8" fill="#FBE6E2" stroke="#A23B2A"/><rect x="278" y="164" width="110" height="46" rx="8" fill="#FBE6E2" stroke="#A23B2A"/><rect x="278" y="244" width="110" height="46" rx="8" fill="#E3F3EA" stroke="#1E7A4C"/>
  </g>
  <g font-size="13" fill="#1B2430">
    <text x="36" y="103" font-weight="700">12 V battery 12.4 V or more</text><text x="36" y="121">at rest?</text>
    <text x="36" y="183" font-weight="700">Fuses OK? PSD RH, PSD LH,</text><text x="36" y="201">ECU-B (see Fuses)</text>
    <text x="36" y="263" font-weight="700">Reset: battery off 1 min, door</text><text x="36" y="281">switch ON, open and close fully</text>
    <text x="36" y="351" font-weight="700">Still wrong? Operate it and</text><text x="36" y="369">listen and watch:</text>
  </g>
  <g font-size="12" fill="#1B2430" text-anchor="middle">
    <text x="333" y="104" font-weight="700" fill="#A23B2A">No: charge</text><text x="333" y="120">or replace it</text>
    <text x="333" y="184" font-weight="700" fill="#A23B2A">Blown: replace</text><text x="333" y="200">(same rating)</text>
    <text x="333" y="264" font-weight="700" fill="#1E7A4C">Works now?</text><text x="333" y="280">Done</text>
  </g>
  <g stroke-width="1.5">
    <rect x="12" y="412" width="120" height="104" rx="8" fill="#FBF0D9" stroke="#8A5A00"/>
    <rect x="140" y="412" width="120" height="104" rx="8" fill="#FBF0D9" stroke="#8A5A00"/>
    <rect x="268" y="412" width="120" height="104" rx="8" fill="#FBF0D9" stroke="#8A5A00"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#1B2430">
    <text x="72" y="432" font-weight="700">Motor runs,</text><text x="72" y="447" font-weight="700">door doesn't move</text>
    <text x="72" y="472">Likely a broken</text><text x="72" y="487">cable</text>
    <text x="200" y="432" font-weight="700">Motor silent</text>
    <text x="200" y="472">Motor, its plug</text><text x="200" y="487">or wiring</text>
    <text x="328" y="432" font-weight="700">Stops partway</text><text x="328" y="447" font-weight="700">or jams</text>
    <text x="328" y="472">Worn cable sheath</text><text x="328" y="487">or dry runners:</text><text x="328" y="502">clean and lubricate</text>
  </g>
  <text x="200" y="546" font-size="12" fill="#5D6B7A" text-anchor="middle">Keep hands clear: the door can close hard while it re-learns.</text>
</svg>
