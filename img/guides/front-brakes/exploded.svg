<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <title>Front brake parts, exploded view</title>
  <rect width="400" height="360" fill="#FFFFFF"/>
  <line x1="20" y1="170" x2="390" y2="170" stroke="#B9C3CE" stroke-width="1.5" stroke-dasharray="6 5"/>
  <!-- disc (edge on) + hat -->
  <rect x="34" y="60" width="16" height="220" rx="3" fill="#B9C3CE" stroke="#1B2430" stroke-width="2"/>
  <rect x="50" y="125" width="20" height="90" fill="#E8EDF2" stroke="#1B2430" stroke-width="2"/>
  <!-- carrier -->
  <rect x="100" y="84" width="30" height="172" fill="#5D6B7A" stroke="#1B2430" stroke-width="2"/>
  <circle cx="115" cy="104" r="6" fill="#FFFFFF"/><circle cx="115" cy="236" r="6" fill="#FFFFFF"/>
  <!-- pads -->
  <g stroke="#1B2430" stroke-width="2">
    <rect x="158" y="112" width="10" height="116" fill="#1B2430"/><rect x="168" y="116" width="10" height="108" fill="#8A6A3A"/>
    <rect x="206" y="116" width="10" height="108" fill="#8A6A3A"/><rect x="216" y="112" width="10" height="116" fill="#1B2430"/>
  </g>
  <!-- pad clips -->
  <path d="M160 100 l6 -8 l6 8 l6 -8 l6 8 M208 100 l6 -8 l6 8 l6 -8 l6 8" fill="none" stroke="#2F6FB3" stroke-width="2.5"/>
  <path d="M160 242 l6 8 l6 -8 l6 8 l6 -8 M208 242 l6 8 l6 -8 l6 8 l6 -8" fill="none" stroke="#2F6FB3" stroke-width="2.5"/>
  <!-- caliper body with piston -->
  <path d="M262 96 h80 q14 0 14 14 v120 q0 14 -14 14 h-80 z" fill="#A23B2A" stroke="#1B2430" stroke-width="2"/>
  <rect x="250" y="140" width="14" height="60" fill="#B9C3CE" stroke="#1B2430" stroke-width="2"/>
  <!-- caliper bolts / slide pins -->
  <g stroke="#1B2430" stroke-width="2"><rect x="292" y="72" width="44" height="12" rx="3" fill="#E8EDF2"/><rect x="292" y="256" width="44" height="12" rx="3" fill="#E8EDF2"/></g>
  <g font-size="13" fill="#1B2430">
    <text x="42" y="300" text-anchor="middle" font-weight="700">Disc</text>
    <text x="115" y="74" text-anchor="middle" font-weight="700">Carrier</text>
    <text x="115" y="300" text-anchor="middle">2 bolts</text>
    <text x="115" y="316" text-anchor="middle" font-weight="700">98 N·m</text>
    <text x="192" y="300" text-anchor="middle" font-weight="700">Pads</text>
    <text x="192" y="316" text-anchor="middle">friction sides</text>
    <text x="192" y="332" text-anchor="middle">face the disc</text>
    <text x="192" y="80" text-anchor="middle" fill="#2F6FB3" font-weight="700">Clips</text>
    <text x="314" y="300" text-anchor="middle" font-weight="700">Caliper + piston</text>
    <text x="314" y="316" text-anchor="middle">2 bolts / slide pins</text>
    <text x="314" y="332" text-anchor="middle" font-weight="700">34 N·m</text>
    <text x="314" y="62" text-anchor="middle">grease the slide pins</text>
  </g>
  <text x="200" y="352" font-size="11" fill="#5D6B7A" text-anchor="middle">Illustration of a typical sliding caliper, not the exact ANH20 part.</text>
</svg>
