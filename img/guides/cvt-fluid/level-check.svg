<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <title>CVT fluid level check, step by step</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5D6B7A"/></marker></defs>
  <rect width="400" height="520" fill="#FFFFFF"/>
  <g stroke="#1B2430" stroke-width="1.5" fill="#E8EDF2">
    <rect x="20" y="12" width="360" height="44" rx="8"/>
    <rect x="20" y="72" width="360" height="44" rx="8"/>
    <rect x="20" y="132" width="360" height="44" rx="8"/>
    <rect x="20" y="192" width="360" height="62" rx="8"/>
    <rect x="20" y="270" width="360" height="44" rx="8"/>
  </g>
  <g stroke="#5D6B7A" stroke-width="2" marker-end="url(#a)">
    <line x1="200" y1="56" x2="200" y2="70"/><line x1="200" y1="116" x2="200" y2="130"/><line x1="200" y1="176" x2="200" y2="190"/><line x1="200" y1="254" x2="200" y2="268"/>
    <line x1="200" y1="314" x2="72" y2="340"/><line x1="200" y1="314" x2="200" y2="340"/><line x1="200" y1="314" x2="328" y2="340"/>
  </g>
  <g font-size="14" fill="#1B2430">
    <text x="34" y="31" font-weight="700">1  Car level · fluid cold, slightly overfilled</text>
    <text x="52" y="48" font-size="12" fill="#5D6B7A">The check window is 35–45 °C</text>
    <text x="34" y="99" font-weight="700">2  Ignition ON, A/C OFF, then ignition OFF</text>
    <text x="34" y="151" font-weight="700">3  Bridge OBD socket pins 4 and 13</text>
    <text x="52" y="168" font-size="12" fill="#5D6B7A">with a short wire (see the pin diagram)</text>
    <text x="34" y="212" font-weight="700">4  Start the engine. Shift N→D→N→D</text>
    <text x="52" y="230">quickly (under 1.5 s each) until the</text>
    <text x="52" y="247">D light stays lit for 2 seconds</text>
    <text x="34" y="297" font-weight="700">5  Remove the wire, select P</text>
  </g>
  <!-- outcomes -->
  <g stroke-width="1.5">
    <rect x="12" y="344" width="120" height="96" rx="8" fill="#E3F0FB" stroke="#2F6FB3"/>
    <rect x="140" y="344" width="120" height="96" rx="8" fill="#FBE6E2" stroke="#A23B2A"/>
    <rect x="268" y="344" width="120" height="96" rx="8" fill="#E3F3EA" stroke="#1E7A4C"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="72" y="366" font-weight="700" fill="#2F6FB3">D light OFF</text>
    <text x="72" y="388" fill="#1B2430">Too cold.</text>
    <text x="72" y="405" fill="#1B2430">Wait, watch</text>
    <text x="72" y="422" fill="#1B2430">again</text>
    <text x="200" y="366" font-weight="700" fill="#A23B2A">D FLASHING</text>
    <text x="200" y="388" fill="#1B2430">Too hot. Let it</text>
    <text x="200" y="405" fill="#1B2430">cool and start</text>
    <text x="200" y="422" fill="#1B2430">from step 1</text>
    <text x="328" y="366" font-weight="700" fill="#1E7A4C">D STEADY</text>
    <text x="328" y="388" fill="#1B2430">In the window:</text>
    <text x="328" y="405" fill="#1B2430">open the drain</text>
    <text x="328" y="422" fill="#1B2430">plug now</text>
  </g>
  <g font-size="13" fill="#1B2430">
    <text x="20" y="466" font-weight="700">Engine running: let the excess run out of the overflow</text>
    <text x="20" y="484">tube until it just drips, then refit the plug (new gasket).</text>
    <text x="20" y="508" fill="#A23B2A" font-weight="700">Nothing comes out? It's low: add fluid and redo the check.</text>
  </g>
</svg>
