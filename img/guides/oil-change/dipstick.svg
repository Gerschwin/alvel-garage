<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <title>Reading the dipstick</title>
  <defs>
    <pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#5D6B7A" stroke-width="1.2"/></pattern>
  </defs>
  <rect width="400" height="230" fill="#FFFFFF"/>
  <text x="200" y="24" font-size="15" fill="#1B2430" text-anchor="middle" font-weight="700">Wipe it, push fully in, pull out, read</text>
  <!-- handle end -->
  <rect x="14" y="78" width="40" height="30" rx="8" fill="#5D6B7A"/>
  <!-- blade -->
  <path d="M54 86 L366 86 Q382 93 366 100 L54 100 Z" fill="#E8EDF2" stroke="#1B2430" stroke-width="2"/>
  <!-- safe zone between F and L -->
  <rect x="226" y="86" width="96" height="14" fill="url(#h)"/>
  <!-- oil film from tip to level -->
  <path d="M276 87 L366 87 Q380 93 366 99 L276 99 Z" fill="#D69E2E" opacity=".85"/>
  <!-- marks -->
  <line x1="226" y1="74" x2="226" y2="112" stroke="#1B2430" stroke-width="2.5"/>
  <line x1="322" y1="74" x2="322" y2="112" stroke="#1B2430" stroke-width="2.5"/>
  <text x="226" y="66" font-size="15" text-anchor="middle" font-weight="700" fill="#1B2430">F (full)</text>
  <text x="322" y="66" font-size="15" text-anchor="middle" font-weight="700" fill="#1B2430">L (low)</text>
  <text x="378" y="128" font-size="12" text-anchor="end" fill="#5D6B7A">tip</text>
  <!-- verdicts -->
  <g font-size="14">
    <text x="20" y="150" fill="#1E7A4C" font-weight="700">✓ Oil film ends between F and L: OK</text>
    <text x="20" y="176" fill="#8A5A00" font-weight="700">! Ends below L: top up a little at a time</text>
    <text x="20" y="202" fill="#A23B2A" font-weight="700">✕ Above F: overfilled, drain some out</text>
  </g>
  <text x="20" y="224" font-size="12" fill="#5D6B7A">Check on level ground, engine warmed, then off for 5+ minutes.</text>
</svg>
