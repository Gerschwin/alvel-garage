<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <title>Good and blown blade fuses, and the rating colours</title>
  <rect width="400" height="260" fill="#FFFFFF"/>
  <!-- good fuse -->
  <g transform="translate(40 24)">
    <rect x="0" y="0" width="100" height="70" rx="10" fill="#2F6FB3" opacity=".25" stroke="#2F6FB3" stroke-width="2"/>
    <path d="M28 70 V38 H72 V70" fill="none" stroke="#5D6B7A" stroke-width="5"/>
    <rect x="22" y="70" width="14" height="40" fill="#B9C3CE" stroke="#5D6B7A"/><rect x="64" y="70" width="14" height="40" fill="#B9C3CE" stroke="#5D6B7A"/>
    <text x="50" y="26" font-size="15" text-anchor="middle" font-weight="700" fill="#1B2430">15</text>
    <text x="50" y="136" font-size="15" text-anchor="middle" font-weight="700" fill="#1E7A4C">✓ Good</text>
    <text x="50" y="154" font-size="12" text-anchor="middle" fill="#5D6B7A">link unbroken</text>
  </g>
  <!-- blown fuse -->
  <g transform="translate(220 24)">
    <rect x="0" y="0" width="100" height="70" rx="10" fill="#2F6FB3" opacity=".25" stroke="#2F6FB3" stroke-width="2"/>
    <path d="M28 70 V38 H44 M56 38 H72 V70" fill="none" stroke="#5D6B7A" stroke-width="5"/>
    <circle cx="50" cy="38" r="7" fill="#1B2430" opacity=".35"/>
    <rect x="22" y="70" width="14" height="40" fill="#B9C3CE" stroke="#5D6B7A"/><rect x="64" y="70" width="14" height="40" fill="#B9C3CE" stroke="#5D6B7A"/>
    <text x="50" y="26" font-size="15" text-anchor="middle" font-weight="700" fill="#1B2430">15</text>
    <text x="50" y="136" font-size="15" text-anchor="middle" font-weight="700" fill="#A23B2A">✕ Blown</text>
    <text x="50" y="154" font-size="12" text-anchor="middle" fill="#5D6B7A">gap or blackening</text>
  </g>
  <!-- colour key -->
  <g font-size="12" fill="#1B2430" text-anchor="middle">
    <rect x="18" y="200" width="56" height="22" rx="4" fill="#8B5A2B"/><text x="46" y="238">7.5 A</text>
    <rect x="80" y="200" width="56" height="22" rx="4" fill="#C62828"/><text x="108" y="238">10 A</text>
    <rect x="142" y="200" width="56" height="22" rx="4" fill="#1E5FBF"/><text x="170" y="238">15 A</text>
    <rect x="204" y="200" width="56" height="22" rx="4" fill="#F2C200"/><text x="232" y="238">20 A</text>
    <rect x="266" y="200" width="56" height="22" rx="4" fill="#E8EDF2" stroke="#5D6B7A"/><text x="294" y="238">25 A</text>
    <rect x="328" y="200" width="56" height="22" rx="4" fill="#2E8B3E"/><text x="356" y="238">30 A</text>
  </g>
  <text x="200" y="256" font-size="11" fill="#5D6B7A" text-anchor="middle">Usual mini-blade colours. Always match the number printed on the fuse.</text>
</svg>
